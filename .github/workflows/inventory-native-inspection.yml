name: Inspect inventory mapping candidates
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/inventory-native-inspection.yml
      - tools/inspect-native-references.py
      - tools/find-inventory-action-types.py
      - tests/inspect_native_references_test.py
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - name: Install ARM64 disassembler
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'ndk;28.2.13676358'
      - name: Disassemble candidate references from pinned native image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/minecraft"
          gh release download minecraft-input --repo "$GITHUB_REPOSITORY" --pattern 'Minecraft-1.21.111-arm64-v8a.apk' --dir "$RUNNER_TEMP/minecraft"
          APK="$RUNNER_TEMP/minecraft/Minecraft-1.21.111-arm64-v8a.apk"
          echo '69f6584c000a4ec80ff8c4790f43d80b3e2ee67788842fdd39fd5be70fdb3d59  '"$APK" | sha256sum -c -
          unzip -p "$APK" lib/arm64-v8a/libminecraftpe.so > "$RUNNER_TEMP/libminecraftpe.so"
          echo '65b9a43178a8b2cde19b6e000613b1453f8f2ea964b094faaf6e206ef041fed1  '"$RUNNER_TEMP/libminecraftpe.so" | sha256sum -c -
          OBJDUMP="$ANDROID_SDK_ROOT/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          python3 tests/inspect_native_references_test.py
          python3 tools/inspect-native-references.py --lib "$RUNNER_TEMP/libminecraftpe.so" --objdump "$OBJDUMP" --output "$RUNNER_TEMP/inventory-inspection"
          python3 tools/find-inventory-action-types.py --lib "$RUNNER_TEMP/libminecraftpe.so" --objdump "$OBJDUMP" --output "$RUNNER_TEMP/inventory-inspection/action-rtti.txt"
          rm "$RUNNER_TEMP/libminecraftpe.so"
      - name: Surface transaction candidates
        run: |
          python3 - "$RUNNER_TEMP/inventory-inspection" begin-request add-request-action <<'PYCODE'
          import pathlib,sys
          for name in sys.argv[2:]:
              lines=pathlib.Path(sys.argv[1],name+'.txt').read_text().splitlines()
              text=' | '.join(line.strip() for line in lines if line.strip()).replace('%','%25')
              for i in range(0,len(text),4500): print(f'::notice title={name} {i//4500+1}::{text[i:i+4500]}')
          PYCODE
      - name: Surface slot candidates
        run: |
          python3 - "$RUNNER_TEMP/inventory-inspection" selected-slot selected-slot-index <<'PYCODE'
          import pathlib,sys
          for name in sys.argv[2:]:
              lines=pathlib.Path(sys.argv[1],name+'.txt').read_text().splitlines()
              text=' | '.join(line.strip() for line in lines if line.strip()).replace('%','%25')
              for i in range(0,len(text),4500): print(f'::notice title={name} {i//4500+1}::{text[i:i+4500]}')
          PYCODE
      - name: Surface offhand and interaction candidates
        run: |
          python3 - "$RUNNER_TEMP/inventory-inspection" offhand-container use-item-on-block <<'PYCODE'
          import pathlib,sys
          for name in sys.argv[2:]:
              lines=pathlib.Path(sys.argv[1],name+'.txt').read_text().splitlines()
              text=' | '.join(line.strip() for line in lines if line.strip()).replace('%','%25')
              for i in range(0,len(text),4500): print(f'::notice title={name} {i//4500+1}::{text[i:i+4500]}')
          PYCODE
      - name: Surface transaction callers
        run: |
          python3 - "$RUNNER_TEMP/inventory-inspection" add-wrapper-1-callers add-wrapper-2-callers begin-wrapper-callers <<'PYCODE'
          import pathlib,sys
          for name in sys.argv[2:]:
              path=pathlib.Path(sys.argv[1],name+'.txt')
              if not path.exists(): continue
              text=' | '.join(line.strip() for line in path.read_text().splitlines() if line.strip()).replace('%','%25')
              for i in range(0,min(len(text),18000),4500): print(f'::notice title={name} {i//4500+1}::{text[i:i+4500]}')
          PYCODE
      - name: Surface action constructors and context
        run: |
          python3 - "$RUNNER_TEMP/inventory-inspection" action-context action-constructor legacy-action-construct-a legacy-action-construct-b inventory-ui-context <<'PYCODE'
          import pathlib,sys
          for name in sys.argv[2:]:
              path=pathlib.Path(sys.argv[1],name+'.txt')
              text=' | '.join(line.strip() for line in path.read_text().splitlines() if line.strip()).replace('%','%25')
              for i in range(0,min(len(text),8000),4000): print(f'::notice title={name} {i//4000+1}::{text[i:i+4000]}')
          PYCODE
      - name: Surface action constructor callers
        run: |
          python3 - "$RUNNER_TEMP/inventory-inspection" action-constructor-callers legacy-action-construct-a-callers legacy-action-construct-b-callers <<'PYCODE'
          import pathlib,sys
          for name in sys.argv[2:]:
              path=pathlib.Path(sys.argv[1],name+'.txt')
              if not path.exists(): continue
              lines=path.read_text().splitlines()
              text=' | '.join(line.strip() for line in lines if line.strip()).replace('%','%25')
              for i in range(0,min(len(text),12000),4000): print(f'::notice title={name} {i//4000+1}::{text[i:i+4000]}')
          PYCODE
      - name: Surface manager and action accessors
        run: |
          python3 - "$RUNNER_TEMP/inventory-inspection" manager-candidate-getter action-base-constructor action-owner-accessor action-slot-accessor <<'PYCODE'
          import pathlib,sys
          for name in sys.argv[2:]:
              path=pathlib.Path(sys.argv[1],name+'.txt')
              text=' | '.join(line.strip() for line in path.read_text().splitlines() if line.strip()).replace('%','%25')
              for i in range(0,min(len(text),8000),4000): print(f'::notice title={name} {i//4000+1}::{text[i:i+4000]}')
          PYCODE
      - name: Surface manager getter callers
        run: |
          python3 - "$RUNNER_TEMP/inventory-inspection" manager-candidate-getter-callers <<'PYCODE'
          import pathlib,sys
          for name in sys.argv[2:]:
              path=pathlib.Path(sys.argv[1],name+'.txt')
              if not path.exists(): continue
              text=' | '.join(line.strip() for line in path.read_text().splitlines() if line.strip()).replace('%','%25')
              for i in range(0,min(len(text),12000),4000): print(f'::notice title={name} {i//4000+1}::{text[i:i+4000]}')
          PYCODE
      - name: Surface action type metadata
        run: |
          python3 - "$RUNNER_TEMP/inventory-inspection/vtable-raw.txt" <<'PYCODE'
          import pathlib,sys
          for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
              print('::notice title=Action type metadata::'+line.replace('%','%25'))
          PYCODE
      - name: Surface swap action type references
        run: |
          python3 - "$RUNNER_TEMP/inventory-inspection/action-rtti.txt" <<'PYCODE'
          import pathlib,sys
          lines=pathlib.Path(sys.argv[1]).read_text().splitlines()
          summary=[x for x in lines if x.startswith(('RTTI ', 'TYPEINFO ', 'VTABLE '))]
          for line in summary[:10]: print('::notice title=Swap action metadata::'+line.replace('%','%25'))
          PYCODE
      - name: Surface swap action code
        run: |
          python3 - "$RUNNER_TEMP/inventory-inspection/action-rtti.txt" <<'PYCODE'
          import pathlib,sys
          lines=pathlib.Path(sys.argv[1]).read_text().splitlines()
          text=' | '.join(line.strip() for line in lines if line.strip()).replace('%','%25')
          for i in range(0,min(len(text),38000),4000):print(f'::notice title=Swap action code {i//4000+1}::{text[i:i+4000]}')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-native-inspection
          path: ${{ runner.temp }}/inventory-inspection/*.txt
          if-no-files-found: error
          retention-days: 7
