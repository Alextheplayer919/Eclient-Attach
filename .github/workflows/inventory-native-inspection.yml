name: Inspect inventory mapping candidates
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/inventory-native-inspection.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - name: Install ARM64 disassembler
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'ndk;28.2.13676358'
      - name: Disassemble candidate references from pinned native image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/minecraft"
          gh release download minecraft-input --repo "$GITHUB_REPOSITORY" --pattern 'Minecraft-1.21.111-arm64-v8a.apk' --dir "$RUNNER_TEMP/minecraft"
          APK="$RUNNER_TEMP/minecraft/Minecraft-1.21.111-arm64-v8a.apk"
          echo '69f6584c000a4ec80ff8c4790f43d80b3e2ee67788842fdd39fd5be70fdb3d59  '"$APK" | sha256sum -c -
          unzip -p "$APK" lib/arm64-v8a/libminecraftpe.so > "$RUNNER_TEMP/libminecraftpe.so"
          echo '65b9a43178a8b2cde19b6e000613b1453f8f2ea964b094faaf6e206ef041fed1  '"$RUNNER_TEMP/libminecraftpe.so" | sha256sum -c -
          OBJDUMP="$ANDROID_SDK_ROOT/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          python3 - "$OBJDUMP" "$RUNNER_TEMP/libminecraftpe.so" "$RUNNER_TEMP/inventory-inspection.txt" <<'PYCODE'
          import subprocess,sys
          objdump,lib,output=sys.argv[1:]
          sites=[('beginRequest log reference',0xcc92740),('addRequestAction success log reference',0xcc93310),('selectedSlot reference',0xc5756e8),('selectedSlotIndex reference',0xc5764dc),('offhand container id reference',0xa2955b0),('useItemOnBlock reference',0xbaf96ec)]
          with open(output,'w') as f:
              for label,addr in sites:
                  text=subprocess.check_output([objdump,'-d',f'--start-address={addr-96}',f'--stop-address={addr+96}',lib],text=True)
                  f.write(f'\n=== {label} @ {addr:#x} ===\n{text}\n')
                  lines=[x.strip() for x in text.splitlines() if x.lstrip().startswith(tuple('0123456789abcdef'))]
                  for start in range(0,len(lines),12):
                      chunk=' | '.join(lines[start:start+12]).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                      print(f'::notice title={label} part {start//12+1}::{chunk}')
          PYCODE
          rm "$RUNNER_TEMP/libminecraftpe.so"
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-native-inspection
          path: ${{ runner.temp }}/inventory-inspection.txt
          if-no-files-found: error
          retention-days: 7
