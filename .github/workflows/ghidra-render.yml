name: Targeted Ghidra render research
on:
  push:
    paths:
      - tools/ghidra/**
      - .github/workflows/ghidra-render.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decompile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download verified Ghidra and pinned Minecraft library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ghidra" "$RUNNER_TEMP/project" "$RUNNER_TEMP/report"
          gh release download Ghidra_11.4.2_build --repo NationalSecurityAgency/ghidra --pattern ghidra_11.4.2_PUBLIC_20250826.zip --dir "$RUNNER_TEMP/ghidra"
          echo '795a02076af16257bd6f3f4736c4fc152ce9ff1f95df35cd47e2adc086e037a6  '"$RUNNER_TEMP/ghidra/ghidra_11.4.2_PUBLIC_20250826.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ghidra/ghidra_11.4.2_PUBLIC_20250826.zip" -d "$RUNNER_TEMP/ghidra"
          rm "$RUNNER_TEMP/ghidra/ghidra_11.4.2_PUBLIC_20250826.zip"
          gh release download minecraft-input --repo "$GITHUB_REPOSITORY" --pattern 'Minecraft-1.21.111-arm64-v8a.apk' --dir "$RUNNER_TEMP"
          APK="$RUNNER_TEMP/Minecraft-1.21.111-arm64-v8a.apk"
          echo '69f6584c000a4ec80ff8c4790f43d80b3e2ee67788842fdd39fd5be70fdb3d59  '"$APK" | sha256sum -c -
          unzip -p "$APK" lib/arm64-v8a/libminecraftpe.so > "$RUNNER_TEMP/libminecraftpe.so"
          echo '65b9a43178a8b2cde19b6e000613b1453f8f2ea964b094faaf6e206ef041fed1  '"$RUNNER_TEMP/libminecraftpe.so" | sha256sum -c -
          rm "$APK"
      - name: Resolve FDE boundaries
        run: |
          python3 - "$RUNNER_TEMP/libminecraftpe.so" "$RUNNER_TEMP/report/sites.tsv" "$RUNNER_TEMP/elf-base.txt" <<'PYCODE'
          import importlib.util, pathlib, struct, subprocess, sys
          spec=importlib.util.spec_from_file_location('inspect', 'tools/inspect-render-candidates.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          with subprocess.Popen(['readelf','--debug-dump=frames',sys.argv[1]],stdout=subprocess.PIPE,text=True) as p:
              bounds=mod.ranges(p.stdout)
          if p.returncode or len(bounds)!=len(mod.SITES): raise SystemExit('missing FDEs')
          pathlib.Path(sys.argv[2]).write_text(''.join(f'{name}\t{site:x}\t{bounds[name][0]:x}\t{bounds[name][1]:x}\n' for name,site in mod.SITES.items()))
          with open(sys.argv[1],'rb') as f:
              h=f.read(64); off=struct.unpack_from('<Q',h,32)[0]; size,count=struct.unpack_from('<HH',h,54); bases=[]
              for i in range(count):
                  f.seek(off+i*size); ph=f.read(56)
                  if struct.unpack_from('<I',ph)[0]==1: bases.append(struct.unpack_from('<Q',ph,16)[0])
          if not bases: raise SystemExit('no PT_LOAD')
          pathlib.Path(sys.argv[3]).write_text(f'{min(bases):x}')
          PYCODE
      - name: Targeted disassembly and decompilation (no whole-library auto-analysis)
        run: |
          "$RUNNER_TEMP/ghidra/ghidra_11.4.2_PUBLIC/support/analyzeHeadless" "$RUNNER_TEMP/project" minecraft \
            -import "$RUNNER_TEMP/libminecraftpe.so" -noanalysis -max-cpu 2 \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra" \
            -postScript RenderCandidates.java "$RUNNER_TEMP/report/sites.tsv" "$RUNNER_TEMP/report/decompile.txt" "$(cat "$RUNNER_TEMP/elf-base.txt")" \
            -log "$RUNNER_TEMP/report/ghidra.log"
          test -s "$RUNNER_TEMP/report/decompile.txt"
          grep -Eq '^Completed: [1-9][0-9]*$' "$RUNNER_TEMP/report/decompile.txt"
          python3 - "$RUNNER_TEMP/report/decompile.txt" <<'PYCODE'
          import sys
          for line in open(sys.argv[1]):
              if line.startswith(('===', 'Ghidra entry=', 'FAILED:', 'Completed:')):
                  print('::notice title=Ghidra targeted research::'+line.strip().replace('%','%25'))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghidra-render-research
          path: ${{ runner.temp }}/report/
          if-no-files-found: warn
          retention-days: 7
