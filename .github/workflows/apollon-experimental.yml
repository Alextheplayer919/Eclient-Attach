name: Build experimental Apollon E-Client APK
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apollon-experimental.yml
      - apollon-adapter/**
      - tests/**
      - tools/build-apollon-apk.sh
      - tools/prepare-apollon-adapter.py
      - tools/check-apollon-target.py
      - tools/check-apollon-jni.py
      - tools/patch-minecraft-apk.sh
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install apktool
        run: |
          mkdir -p "$HOME/bin"
          curl --fail --location --retry 5 -o "$HOME/bin/apktool.jar" https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          printf '#!/bin/sh\nexec java -jar "$HOME/bin/apktool.jar" "$@"\n' > "$HOME/bin/apktool"
          chmod +x "$HOME/bin/apktool"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Download pinned Minecraft APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/minecraft"
          gh release download minecraft-input --repo "$GITHUB_REPOSITORY" \
            --pattern 'Minecraft-1.21.111-arm64-v8a.apk' --dir "$RUNNER_TEMP/minecraft"
      - name: Test Fly2 calculation on host
        run: |
          python3 tests/check_module_menu.py
          g++ -std=c++17 -Wall -Wextra -Werror tests/fly2_test.cpp apollon-adapter/fly/fly2.cpp -o "$RUNNER_TEMP/fly2-test"
          "$RUNNER_TEMP/fly2-test"
          g++ -std=c++17 -Wall -Wextra -Werror tests/fly2_adapter_test.cpp -o "$RUNNER_TEMP/fly2-adapter-test"
          "$RUNNER_TEMP/fly2-adapter-test"
          g++ -std=c++17 -Wall -Wextra -Werror tests/fly2_calculated_test.cpp apollon-adapter/fly/fly2.cpp -o "$RUNNER_TEMP/fly2-calculated-test"
          "$RUNNER_TEMP/fly2-calculated-test"
          g++ -std=c++17 -Wall -Wextra -Werror tests/fly2_probe_test.cpp -o "$RUNNER_TEMP/fly2-probe-test"
          "$RUNNER_TEMP/fly2-probe-test"
          g++ -std=c++17 -Wall -Wextra -Werror tests/placement_forward_test.cpp -o "$RUNNER_TEMP/placement-forward-test"
          "$RUNNER_TEMP/placement-forward-test"
      - name: Build experimental APK
        run: tools/build-apollon-apk.sh "$RUNNER_TEMP/minecraft/Minecraft-1.21.111-arm64-v8a.apk"
      - name: Verify special-edition assets are absent
        run: |
          python3 - <<'PYCODE'
          import zipfile
          with zipfile.ZipFile('out/eclient-apollon-experimental-arm64.apk') as apk:
              bad=[name for name in apk.namelist() if name.lower().startswith('assets/eclient-special/') or name.lower() == 'assets/e.mp3']
              if bad: raise SystemExit('Unexpected special-edition music: '+repr(bad))
          print('No special-edition music assets packaged.')
          PYCODE
      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: eclient-apollon-experimental-arm64
          path: out/eclient-apollon-experimental-arm64.apk
          if-no-files-found: error
          retention-days: 7
